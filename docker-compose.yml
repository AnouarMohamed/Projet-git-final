services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskpilot-app
    container_name: taskpilot-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - taskpilot-network

  nginx:
    image: nginx:alpine
    container_name: taskpilot-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - taskpilot-network

  mysql:
    image: mysql:8.0
    container_name: taskpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskpilot
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: taskpilot
    ports:
      - "3306:3306"
    volumes:
      - taskpilot-db:/var/lib/mysql
    networks:
      - taskpilot-network

  redis:
    image: redis:alpine
    container_name: taskpilot-redis
    restart: unless-stopped
    networks:
      - taskpilot-network

networks:
  taskpilot-network:
    driver: bridge

volumes:
  taskpilot-db:
    driver: local
